---
name: Complete DevOps  Pipeline

on:
  push:
    branches:
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Set Short SHA
        run: |
          echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV
      - name: Build Docker Image
        run: |
          docker build -t  abderrahim98/complete-devops-project:${{ env.SHORT_SHA }} .
      - name: Login To DockerHub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME}}" --password-stdin
      - name: Push to DockerHub
        run: |
          docker push abderrahim98/complete-devops-project:${{ env.SHORT_SHA }}
      - name: Congure Git Author
        run: |
          git config --local user.email "abderrahim581@hotmail.com"
          git config --local user.name "abderrahimx05"
      - name: Update Helm Chart with new image tag
        run: |
          sed -i "s/tag:.*/tag: ${{ env.SHORT_SHA }}/" ./complete-devops-project-time-printer/values.yaml
              git add ./complete-devops-project-time-printer/values.yaml
              git commit -m "update image tag to ${{ nv.SHORT_SHA }} "
              git push
